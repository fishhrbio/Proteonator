name: Native Mac graphics
on:
  push:
    branches: [codex/native-platforms]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm setup:electron
      - run: node scripts/probe-native-graphics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-${{ matrix.runner }}
          path: work/graphics-probe/result.json
          retention-days: 7
