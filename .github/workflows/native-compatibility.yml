name: Native document and compatibility checks
on:
  push:
    branches: [codex/native-platforms]
    paths: ['src/**', 'compute/**', 'data/**', 'fixtures/**', 'assets/**', 'licenses/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'requirements-compute.txt', 'THIRD_PARTY_NOTICES.md', 'docs/USER_GUIDE.*', 'docs/SCIENCE.*', '.github/workflows/native-platforms.yml', '.github/workflows/native-compatibility.yml']
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Native package run to verify on additional operating systems
        required: true
permissions:
  contents: read
  actions: read
jobs:
  packages-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      run_id: ${{ steps.packages.outputs.run_id }}
    steps:
      - name: Wait for the native installers
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          if [ -z "$PACKAGE_RUN_ID" ]; then
            for attempt in $(seq 1 24); do
              PACKAGE_RUN_ID=$(gh api 'repos/fishhrbio/Proteonator/actions/workflows/native-platforms.yml/runs?branch=codex%2Fnative-platforms&per_page=20' --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | .id" | head -1)
              if [ -n "$PACKAGE_RUN_ID" ]; then break; fi
              sleep 5
            done
          fi
          test -n "$PACKAGE_RUN_ID"
          echo "run_id=$PACKAGE_RUN_ID" >> "$GITHUB_OUTPUT"
          test "$(gh api repos/fishhrbio/Proteonator/actions/runs/$PACKAGE_RUN_ID --jq .head_sha)" = "$GITHUB_SHA"
          for attempt in $(seq 1 240); do
            count=$(gh api repos/fishhrbio/Proteonator/actions/runs/$PACKAGE_RUN_ID/artifacts --jq '[.artifacts[] | select(.name == "package-mac-arm64" or .name == "package-mac-x64" or .name == "package-linux-x64")] | length')
            if [ "$count" = 3 ]; then exit 0; fi
            sleep 10
          done
          exit 1
  compatibility:
    needs: packages-ready
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: mac-26-arm64, runner: macos-26, artifact: mac-arm64, arch: arm64, full: true}
          - {id: mac-26-x64, runner: macos-26-intel, artifact: mac-x64, arch: x64, full: true}
          - {id: linux-x64-ubuntu-24, runner: ubuntu-24.04, artifact: linux-x64, arch: x64, full: true}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PROTEONATOR_VERIFY_SOFTWARE_GL: "1"
      PROTEONATOR_VERIFY_LABEL: native-result
      PROTEONATOR_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile && pnpm setup:electron
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: release
          run-id: ${{ needs.packages-ready.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.runner }}" = "ubuntu-22.04" ]; then
            sudo apt-get install -y xvfb dbus-x11 libgtk-3-0 libnss3 libxss1 libxtst6 libgbm1 libasound2 xdg-utils desktop-file-utils libglib2.0-bin
          else
            sudo apt-get install -y xvfb dbus-x11 libgtk-3-0t64 libnss3 libxss1 libxtst6 libgbm1 libasound2t64 xdg-utils desktop-file-utils libglib2.0-bin
          fi
      - run: python scripts/native-package.py install
      - name: Select native Mac graphics
        if: runner.os == 'macOS'
        run: node scripts/probe-native-graphics.mjs
      - name: Verify installed Mac integration and document opening
        if: runner.os == 'macOS'
        run: |
          node scripts/verify-native-integration.mjs
          node scripts/verify-native-document.mjs
          node scripts/verify-offline-help.mjs
      - name: Verify Linux integration and native document opening
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- node scripts/verify-native-integration.mjs
          xvfb-run -a dbus-run-session -- node scripts/verify-native-document.mjs
          xvfb-run -a dbus-run-session -- node scripts/verify-offline-help.mjs
      - name: Run all native application suites
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dbus-run-session -- node scripts/verify-native-release.mjs
          else
            node scripts/verify-native-release.mjs
          fi
          python scripts/verify-export-archives.py
          python -m pip install --target work/qa-libs av==16.0.1 numpy==2.3.5
          PYTHONPATH="$GITHUB_WORKSPACE/work/qa-libs" python scripts/verify-video-decode.py
      - run: python scripts/native-package.py finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.id }}
          path: |
            work/native-result/
            work/native-package/lifecycle.json
            work/native-package/integration-result.json
            work/native-package/native-workspace.png
            work/native-document/result.json
            work/graphics-probe/result.json
            work/offline-help/result.json
            work/export-archive-verification.json
            work/video-decode-verification.json
          retention-days: 14
