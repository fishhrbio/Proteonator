name: Native platform packages
on:
  push:
    branches: [codex/native-platforms]
    paths: ['src/**', 'compute/**', 'data/**', 'fixtures/**', 'assets/**', 'licenses/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'requirements-compute.txt', 'THIRD_PARTY_NOTICES.md', 'docs/USER_GUIDE.*', 'docs/SCIENCE.*', '.github/workflows/native-platforms.yml', '.github/workflows/native-compatibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-22.04
            arch: x64
            os: linux
          - id: mac-arm64
            runner: macos-15
            arch: arm64
            os: mac
          - id: mac-x64
            runner: macos-15-intel
            arch: x64
            os: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONNOUSERSITE: "1"
      PROTEONATOR_VERIFY_SOFTWARE_GL: "1"
      PROTEONATOR_TARGET_ARCH: ${{ matrix.arch }}
      PROTEONATOR_VERIFY_LABEL: native-result
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create a clean scientific environment
        run: |
          python -m venv .native-env
          echo "$GITHUB_WORKSPACE/.native-env/bin" >> "$GITHUB_PATH"
          .native-env/bin/python -m pip install -r requirements-compute.txt
      - name: Install desktop dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm setup:electron
          mkdir -p work
      - name: Install Linux desktop system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libgtk-3-0 libnss3 libxss1 libxtst6 libgbm1 libasound2 xdg-utils desktop-file-utils libglib2.0-bin
      - name: Validate source and scientific calculations
        run: |
          pnpm typecheck
          pnpm test > work/native-unit.log
          python -m unittest discover -s compute -p 'test_*.py' -v > work/native-python.log 2>&1
          python compute/verify_physics.py
          python compute/verify_stereochemistry.py
      - name: Package native runtime and desktop
        run: |
          python scripts/render-guides.py
          pnpm make:icon
          pnpm make:platform-icons
          python scripts/freeze-compute.py
          if [ "${{ matrix.os }}" = "mac" ]; then python scripts/prepare-mac-graphics.py; fi
          pnpm build
          pnpm exec electron-builder --${{ matrix.os }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-${{ matrix.id }}
          compression-level: 0
          path: |
            release/*.dmg
            release/*.deb
          if-no-files-found: error
      - name: Install the native package
        run: python scripts/native-package.py install
      - name: Select available Mac graphics backend
        if: matrix.os == 'mac'
        run: node scripts/probe-native-graphics.mjs
      - name: Test installed macOS application
        if: matrix.os == 'mac'
        run: |
          node scripts/verify-native-integration.mjs
          node scripts/verify-native-release.mjs
          node scripts/verify-native-document.mjs
          node scripts/verify-offline-help.mjs
          python scripts/verify-export-archives.py
      - name: Test installed Linux application with sandbox enabled
        if: matrix.os == 'linux'
        run: |
          xvfb-run -a dbus-run-session -- node scripts/verify-native-integration.mjs
          xvfb-run -a dbus-run-session -- node scripts/verify-native-release.mjs
          xvfb-run -a dbus-run-session -- node scripts/verify-native-document.mjs
          xvfb-run -a dbus-run-session -- node scripts/verify-offline-help.mjs
          python scripts/verify-export-archives.py
      - name: Decode real movie exports independently
        run: |
          python -m pip install --target work/qa-libs av==16.0.1 numpy==2.3.5
          PYTHONPATH="$GITHUB_WORKSPACE/work/qa-libs" python scripts/verify-video-decode.py
      - name: Reinstall and uninstall while retaining projects and settings
        run: python scripts/native-package.py finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.id }}
          path: |
            work/native-result/
            work/native-package/lifecycle.json
            work/native-package/integration-result.json
            work/native-package/native-workspace.png
            work/native-unit.log
            work/native-python.log
            work/physics/verification.json
            work/physics/stereochemistry.json
            work/graphics-probe/result.json
            work/mac-graphics/inventory.json
            work/offline-help/result.json
            work/export-archive-verification.json
            work/video-decode-verification.json
            work/native-document/result.json
          retention-days: 14
