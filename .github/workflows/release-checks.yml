name: Proteonator checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PROTEONATOR_PYTHON: python
      PYTHONNOUSERSITE: "1"
      PROTEONATOR_VERIFY_SOFTWARE_GL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-compute.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:electron
      - run: pnpm typecheck
      - run: pnpm test
      - run: python compute/test_molecule.py
      - run: python scripts/freeze-compute.py
      - run: pnpm build
      - run: pnpm dist:win
      - run: pnpm test:studio
        env:
          PROTEONATOR_EXE: ${{ github.workspace }}/release/win-unpacked/Proteonator.exe
      - run: pnpm test:studio-physics
        env:
          PROTEONATOR_EXE: ${{ github.workspace }}/release/win-unpacked/Proteonator.exe
