name: Mac native acceptance
on:
  push:
    branches: [codex/native-platforms]
    paths: [.github/workflows/mac-acceptance.yml, scripts/verify-studio-desktop.mjs]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  accept:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: mac-arm64, runner: macos-15, artifact: mac-arm64, arch: arm64}
          - {id: mac-x64, runner: macos-15-intel, artifact: mac-x64, arch: x64}
          - {id: mac-26-arm64, runner: macos-26, artifact: mac-arm64, arch: arm64}
          - {id: mac-26-x64, runner: macos-26-intel, artifact: mac-x64, arch: x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_RUN: "43558390779"
      PACKAGE_SOURCE: 41cc1a3bfab7642ba5fdba82a237495c359545ab
      GH_TOKEN: ${{ github.token }}
      PROTEONATOR_VERIFY_SOFTWARE_GL: "1"
      PROTEONATOR_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the package's source has no application changes
        run: |
          test "$(gh api repos/fishhrbio/Proteonator/actions/runs/$PACKAGE_RUN --jq .head_sha)" = "$PACKAGE_SOURCE"
          git diff --exit-code "$PACKAGE_SOURCE" HEAD -- src compute data fixtures assets licenses package.json pnpm-lock.yaml requirements-compute.txt THIRD_PARTY_NOTICES.md docs/USER_GUIDE.md docs/USER_GUIDE.html docs/SCIENCE.md docs/SCIENCE.html scripts/build.mjs scripts/freeze-compute.py scripts/compute-runtime.py scripts/runtime_redist.py scripts/prepare-mac-graphics.py scripts/after-pack.cjs scripts/collect_runtime_notices.py scripts/render-guides.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile && pnpm setup:electron
      - name: Wait for the exact native package
        run: |
          for attempt in $(seq 1 180); do
            count=$(gh api repos/fishhrbio/Proteonator/actions/runs/$PACKAGE_RUN/artifacts --jq '.artifacts | map(select(.name == "package-${{ matrix.artifact }}")) | length')
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.artifact }}
          path: release
          run-id: 43558390779
          github-token: ${{ github.token }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.runner }}" = "ubuntu-22.04" ]; then
            sudo apt-get install -y xvfb dbus-x11 libgtk-3-0 libnss3 libxss1 libxtst6 libgbm1 libasound2 xdg-utils desktop-file-utils libglib2.0-bin
          else
            sudo apt-get install -y xvfb dbus-x11 libgtk-3-0t64 libnss3 libxss1 libxtst6 libgbm1 libasound2t64 xdg-utils desktop-file-utils libglib2.0-bin
          fi
      - run: python scripts/native-package.py install
      - name: Select available Mac graphics
        if: runner.os == 'macOS'
        run: node scripts/probe-native-graphics.mjs
      - name: Verify installed Mac application
        if: runner.os == 'macOS'
        run: |
          node scripts/verify-native-integration.mjs
          node scripts/verify-studio-desktop.mjs
          node scripts/verify-native-document.mjs
          node scripts/verify-native-release.mjs
          node scripts/verify-offline-help.mjs
      - name: Verify installed Ubuntu application
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- node scripts/verify-native-integration.mjs
          xvfb-run -a dbus-run-session -- node scripts/verify-native-release.mjs
          xvfb-run -a dbus-run-session -- node scripts/verify-native-document.mjs
          xvfb-run -a dbus-run-session -- node scripts/verify-offline-help.mjs
      - name: Decode real exports independently
        run: |
          python scripts/verify-export-archives.py
          python -m pip install --target work/qa-libs av==16.0.1 numpy==2.3.5
          PYTHONPATH="$GITHUB_WORKSPACE/work/qa-libs" python scripts/verify-video-decode.py
      - run: python scripts/native-package.py finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.id }}
          path: |
            work/native-result/
            work/native-package/lifecycle.json
            work/native-package/integration-result.json
            work/native-package/native-workspace.png
            work/native-document/result.json
            work/graphics-probe/result.json
            work/offline-help/result.json
            work/export-archive-verification.json
            work/video-decode-verification.json
          retention-days: 14
